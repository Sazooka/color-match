<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Match</title>
<style>
:root{--bg:#23262d;--card:#2c303a;--line:#3a3f4b;--ink:#f1f2f5;--sub:#aab2c5;--felt:#3a9a72;--hole:#0b2f20;--go:#6adf4f;--s:52px}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #9fd3ff;outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:30px;font-weight:600;text-align:center;margin:6px 0 2px}
.tag{text-align:center;color:var(--sub);margin:0 0 16px;font-size:14px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
@media(max-width:800px){.top{grid-template-columns:1fr}}
.felt{background:var(--felt);border:2px solid #5dbd93;border-radius:16px;padding:12px 10px;max-width:600px;margin:0 auto}
.row{display:flex;align-items:center;justify-content:center;gap:8px;padding:3px 4px;border-radius:12px}
.row.cur{background:rgba(255,255,255,.12)}
.num{width:16px;text-align:right;font-size:12px;color:#e3f6ec;flex:none}
.pegs{display:grid;gap:4px;flex:none;grid-template-columns:repeat(var(--pc),10px);padding:2px;border-radius:8px}
.pegs.lie{outline:2px solid #ffb04a;outline-offset:2px}
.p{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}
.p.k{background:#000;border-color:#000}.p.w{background:#f4f4f1;border-color:#f4f4f1}.p.t{background:#9fd3ff;border-color:#9fd3ff}
.slots{display:flex;gap:8px}
.h{width:var(--s);height:var(--s);border-radius:50%;background:var(--hole);border:1.5px solid #37a275;display:flex;align-items:center;justify-content:center;padding:0}
button.h:hover{border-color:#9fe6c4}
.b{width:calc(var(--s)*.84);height:calc(var(--s)*.84);border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.b::after{content:"";position:absolute;left:18%;top:14%;width:28%;height:15%;border-radius:50%;background:#fff;opacity:.55;transform:rotate(-35deg)}
.b.q{background:#4a4f5c;font-size:calc(var(--s)*.4);color:#aab2c5}
.d{width:calc(var(--s)*.4);height:calc(var(--s)*.4);border-radius:50%;background:#f7f7f5;color:#1a1c22;font-style:normal;font-size:calc(var(--s)*.27);display:flex;align-items:center;justify-content:center}
.lab{font-size:12px;font-weight:600;color:#e3f6ec;text-align:center;flex:none;white-space:nowrap}
.res{display:inline-block;padding:3px 9px;border-radius:999px;background:#0e2a1f;font-size:13px;font-weight:700}
.res.ok{color:#6adf4f}.res.ng{color:#ff6b6b}
.sepr{border-top:2px dashed rgba(255,255,255,.18);margin:6px 4px}
.status{text-align:center;font-weight:600;margin:12px 0 2px;min-height:24px}
.note{text-align:center;color:#ffb04a;font-size:13px;min-height:18px}
.pal{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:10px 0}
.pal button{width:50px;height:50px;border-radius:50%;background:transparent;border:2px solid transparent;display:flex;align-items:center;justify-content:center;padding:0}
.pal button:active{transform:scale(.92)}
.pal .b{width:44px;height:44px}.pal .d{width:20px;height:20px;font-size:12px}
.pal button:disabled{opacity:.4;cursor:default}
.ctl{display:flex;gap:8px;justify-content:center}
.btn{padding:11px 22px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px}
.btn.go{background:var(--go);border-color:var(--go);color:#0f2a14;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.side{background:var(--card);border-radius:14px;padding:16px}
.side h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:0 0 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.m{text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.m.on{border:2px solid var(--go);padding:8px 9px}
.m b{display:block;font-size:15px}.m small{color:var(--sub);font-size:11px}
.seg{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:13px;color:var(--sub)}
.seg span{width:48px}
.seg button{flex:1;padding:6px 0;border:1px solid var(--line);border-radius:8px;background:transparent}
.seg button.on{background:var(--go);border-color:var(--go);color:#0f2a14;font-weight:600}
.tg{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 0}
.tg b{display:block;font-size:14px;font-weight:500}.tg small{color:var(--sub);font-size:12px;line-height:1.4;display:block}
.sw{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--sub)}
.sw.on{background:var(--go)}.sw.on::after{left:19px;background:#0f2a14}
.how{margin-top:26px}
.how h2{font-size:18px;margin:0 0 10px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.st{background:var(--card);border-radius:10px;padding:14px}
.st b{display:block;margin-bottom:4px;font-size:15px}.st span{color:var(--sub);font-size:13px;line-height:1.5}
.st em{font-style:normal;color:var(--go);font-size:12px;font-weight:600;display:block;margin-bottom:6px}
.leg{background:var(--card);border-radius:10px;padding:14px;display:flex;gap:24px;flex-wrap:wrap;font-size:14px}
.leg .p{display:inline-block;vertical-align:-2px;margin-right:8px;width:14px;height:14px}
.foot{color:var(--sub);font-size:12px;text-align:center;margin:22px 0 6px}
</style>
</head>
<body>
<div class="wrap">
<h1>Color match</h1>
<p class="tag">Crack the hidden color code before you run out of tries.</p>
<div class="top">
  <div class="game">
    <div class="felt" id="felt"></div>
    <div class="status" id="msg" aria-live="polite"></div>
    <div class="note" id="note"></div>
    <div class="pal" id="pal"></div>
    <div class="ctl" id="ctl"></div>
  </div>
  <aside class="side" id="side"></aside>
</div>
<section class="how" id="how"></section>
<p class="foot">Free to play. No ads, no tracking. Keyboard: 1-8 to pick, Backspace to undo, Enter to submit.</p>
</div>
<script>
const COL=[["#e5484d","●"],["#3b6cff","▲"],["#6adf4f","■"],["#ffc933","◆"],["#9b5cf6","★"],["#ff7a1a","✚"],["#12b5d6","⬟"],["#f0509b","♥"]];
const PRE={Normal:[4,6,8],Hard:[5,7,8],Expert:[6,8,8]};
const O={auto:true,totals:false,liar:false};
let mode="Normal",cu=[4,6,8],S={},pend=null;
const $=id=>document.getElementById(id);
const cfg=()=>mode==="Custom"?cu:PRE[mode];

function start(){
  const[n,c,t]=cfg();pend=null;
  S={n,c,t,rows:[],cur:Array(n).fill(null),over:false,win:false,
     secret:Array.from({length:n},()=>Math.random()*c|0),
     L:O.liar?1+(Math.random()*t|0):0,lied:0};
  render();
}
function judge(g,s,c){
  let b=0;const a=Array(c).fill(0),z=Array(c).fill(0);
  g.forEach((x,i)=>{if(x===s[i])b++;else{a[x]++;z[s[i]]++}});
  let w=0;for(let i=0;i<c;i++)w+=Math.min(a[i],z[i]);
  return[b,w];
}
function fake(b,w,n){
  const c=[[b+1,w],[b-1,w],[b,w+1],[b,w-1]].filter(([x,y])=>x>=0&&y>=0&&x+y<=n&&x<n);
  return c[Math.random()*c.length|0];
}
function submit(){
  if(S.over||S.cur.includes(null))return;
  let[b,w]=judge(S.cur,S.secret,S.c);const win=b===S.n;let lie=false;
  if(!win&&S.L===S.rows.length+1){[b,w]=fake(b,w,S.n);lie=true;S.lied=S.rows.length+1}
  S.rows.push({g:S.cur.slice(),b,w,lie});
  S.cur=Array(S.n).fill(null);
  if(win)S.over=S.win=true;else if(S.rows.length>=S.t)S.over=true;
  render();
}
function pick(i){
  if(S.over||i>=S.c)return;
  const k=S.cur.indexOf(null);if(k<0)return;
  S.cur[k]=i;render();
  if(O.auto&&!S.cur.includes(null))setTimeout(submit,220);
}
function undo(){
  if(S.over)return;
  for(let k=S.n-1;k>=0;k--)if(S.cur[k]!=null){S.cur[k]=null;break}
  render();
}
const ball=i=>`<span class="b" style="background:${COL[i][0]}"><i class="d">${COL[i][1]}</i></span>`;
function pegs(r){
  let h="";
  for(let k=0;k<S.n;k++){
    const cl=O.totals?(k<r.b+r.w?" t":""):(k<r.b?" k":k<r.b+r.w?" w":"");
    h+=`<i class="p${cl}"></i>`;
  }
  return h;
}
function render(){
  const pc=Math.ceil(S.n/2);
  document.documentElement.style.setProperty("--pc",pc);
  let h=`<div class="row"><div class="lab" style="width:${pc*14+28}px">${S.over?(S.win?'<span class="res ok">Nice!</span>':'<span class="res ng">Failed</span>'):"Answer"}</div><div class="slots">`;
  for(let i=0;i<S.n;i++)h+=`<div class="h">${S.over?ball(S.secret[i]):'<span class="b q">?</span>'}</div>`;
  h+=`</div></div><div class="sepr"></div>`;
  for(let r=S.t;r>=1;r--){
    const done=r<=S.rows.length,cur=r===S.rows.length+1&&!S.over;
    h+=`<div class="row${cur?" cur":""}"><span class="num">${r}</span>`;
    const R=done?S.rows[r-1]:null;
    h+=`<div class="pegs${R&&R.lie&&S.over?" lie":""}">${R?pegs(R):Array(S.n).fill('<i class="p"></i>').join("")}</div><div class="slots">`;
    for(let i=0;i<S.n;i++){
      if(done)h+=`<div class="h">${ball(R.g[i])}</div>`;
      else if(cur)h+=`<button class="h" data-a="slot:${i}" aria-label="Clear slot ${i+1}">${S.cur[i]!=null?ball(S.cur[i]):""}</button>`;
      else h+=`<div class="h"></div>`;
    }
    h+=`</div></div>`;
  }
  $("felt").innerHTML=h;
  $("felt").querySelectorAll(".pegs").forEach(p=>p.style.gridTemplateColumns=`repeat(${pc},10px)`);
  $("msg").textContent=S.over?(S.win?`Solved in ${S.rows.length} ${S.rows.length===1?"guess":"guesses"}. Nice work!`:"Out of tries. The code is shown above."):`Guess ${S.rows.length+1} of ${S.t}`;
  if(pend)$("note").innerHTML=`Restart with new settings? Your current game will be lost. <button class="btn go" style="padding:4px 12px;font-size:13px" data-a="yes">Restart</button> <button class="btn" style="padding:4px 12px;font-size:13px" data-a="no">Cancel</button>`;
  else $("note").textContent=S.over&&S.L?(S.lied?`Liar mode: guess ${S.lied} showed a false hint (outlined in orange).`:"Liar mode: no false hint was shown this time."):"";
  let p="";
  for(let i=0;i<S.c;i++)p+=`<button data-a="pick:${i}" aria-label="Color ${i+1}" ${S.over?"disabled":""}>${ball(i)}</button>`;
  $("pal").innerHTML=p;
  $("ctl").innerHTML=S.over?`<button class="btn go" data-a="again">Play again</button>`:
    `<button class="btn" data-a="undo" ${S.cur.every(x=>x==null)?"disabled":""}>Undo</button>`+
    (O.auto?"":`<button class="btn go" data-a="submit" ${S.cur.includes(null)?"disabled":""}>Submit</button>`);
  side();how();fit();
}
function seg(label,key,vals,cur){
  return `<div class="seg"><span>${label}</span>`+vals.map(v=>`<button data-a="${key}:${v}" class="${v===cur?"on":""}">${v}</button>`).join("")+`</div>`;
}
function tg(k,t,d){
  return `<button class="tg" role="switch" aria-checked="${O[k]}" data-a="opt:${k}"><span><b>${t}</b><small>${d}</small></span><i class="sw${O[k]?" on":""}"></i></button>`;
}
function side(){
  let h=`<h2>Mode</h2><div class="modes">`;
  for(const m of["Normal","Hard","Expert","Custom"]){
    const v=m==="Custom"?"your own":PRE[m].join(" · ");
    h+=`<button class="m${mode===m?" on":""}" data-a="mode:${m}"><b>${m}</b><small>${m==="Custom"?"Choose below":`${PRE[m][0]} slots · ${PRE[m][1]} colors`}</small></button>`;
  }
  h+=`</div>`;
  if(mode==="Custom")h+=seg("Slots","cn",[4,5,6,7,8],cu[0])+seg("Colors","cc",[6,7,8],cu[1])+seg("Tries","ct",[8,10,12],cu[2]);
  h+=`<h2 style="margin-top:14px">Options</h2>`+
    tg("auto","Auto-submit","Lock in a guess as soon as the row is full.")+
    tg("totals","Totals only","One combined peg count instead of black and white.")+
    tg("liar","Liar mode","One hint is false. The game reveals which one at the end.");
  $("side").innerHTML=h;
}
function how(){
  $("how").innerHTML=`<h2>How to play</h2><div class="steps">
  <div class="st"><em>1</em><b>Pick colors</b><span>Fill every slot in the highlighted row. The same color can appear more than once.</span></div>
  <div class="st"><em>2</em><b>Submit your guess</b><span>Your row locks in and pegs appear on the left to show how close you are.</span></div>
  <div class="st"><em>3</em><b>Solve it</b><span>Crack the code within your tries. Each guess stacks above the last.</span></div></div>
  <div class="leg">`+(O.totals?
    `<span><i class="p t"></i>One peg per correct color (spots are not shown)</span>`:
    `<span><i class="p k"></i>Right color, right spot</span><span><i class="p w"></i>Right color, wrong spot</span>`)+`</div>`;
}
function fit(){
  const w=$("felt").clientWidth,pc=Math.ceil(S.n/2);
  const s=Math.floor((w-20-8-16-16-(pc*14+4)-(S.n-1)*8)/S.n);
  document.documentElement.style.setProperty("--s",Math.max(26,Math.min(56,s))+"px");
}
function guard(fn){
  if(S.rows.length&&!S.over){pend=fn;render();return}
  fn();start();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const[a,v]=t.dataset.a.split(":");
  if(a==="pick")pick(+v);
  else if(a==="slot"){if(!S.over){S.cur[+v]=null;render()}}
  else if(a==="undo")undo();
  else if(a==="submit")submit();
  else if(a==="again")start();
  else if(a==="yes"){const f=pend;pend=null;if(f)f();start()}
  else if(a==="no"){pend=null;render()}
  else if(a==="mode")guard(()=>{mode=v});
  else if(a==="cn")guard(()=>{cu[0]=+v});
  else if(a==="cc")guard(()=>{cu[1]=+v});
  else if(a==="ct")guard(()=>{cu[2]=+v});
  else if(a==="opt"){
    if(v==="liar")guard(()=>{O.liar=!O.liar});
    else{O[v]=!O[v];render()}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="8")pick(+e.key-1);
  else if(e.key==="Backspace"){e.preventDefault();undo()}
  else if(e.key==="Enter"&&document.activeElement.tagName!=="BUTTON")submit();
});
window.addEventListener("resize",fit);
start();
</script>
</body>
</html>
